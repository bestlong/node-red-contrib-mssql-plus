name: CI

on:
  # workflow_dispatch:
  pull_request:
  push:
    paths:
      - ".github/**"
      - ".npmignore"
      - "src/**"
      - "test/**"
      - "package*.json"
  schedule:
    - cron: "0 0 * * 0"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22, 24]

    env:
      MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'P@ssw0rdP@ssw0rd' }}

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'P@ssw0rdP@ssw0rd' }}
          ACCEPT_EULA: "Y"

    steps:
    - uses: actions/checkout@v5

    - name: Create database
      run: |
        docker exec \
          $(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2019-latest") \
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "CREATE DATABASE testdb"

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}

    - name: npm install
      run: npm install

    - name: Generate test config
      run: |
        node -e "
        const cfg = {
          server: 'localhost',
          port: 1433,
          username: 'sa',
          password: process.env.MSSQL_SA_PASSWORD,
          database: 'testdb',
          encyption: false,
          tdsVersion: '7_4',
          trustServerCertificate: true,
          useUTC: true,
          connectTimeout: 15000,
          requestTimeout: 15000,
          cancelTimeout: 5000
        };
        require('fs').writeFileSync('test/config.json', JSON.stringify(cfg, null, 4));
        "

    - name: npm test
      run: npm test
